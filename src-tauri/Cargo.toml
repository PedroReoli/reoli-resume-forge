[package]
name = "reoliresume"
version = "2.0.0"
description = "Editor e compilador local de currículos ATS da Reoli"
authors = ["Pedro Lucas Reis"]
edition = "2024"
license = "MIT"
repository = "https://github.com/PedroReoli/reoli-resume-forge"

[lib]
name = "reoli_resume_forge"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "reoliresume"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
base64 = "0.22.1"
printpdf = { version = "0.12.8", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
